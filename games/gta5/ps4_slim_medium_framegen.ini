# GTA V needs the result copied into its own buffer (out_mode=0): flipping
# GnmScale's buffer instead breaks the game's flip bookkeeping and hangs it.
name=PS4 Slim - Medium Quality + Frame Gen
description=Light FBSR3 with frame generation. The output is copied into the game's own buffer, the only mode GTA V tolerates.
author=FrankBarretta
order=1
status=tested

