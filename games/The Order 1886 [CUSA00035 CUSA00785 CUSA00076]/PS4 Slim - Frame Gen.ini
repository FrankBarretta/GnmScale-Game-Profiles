# GnmScale - written by the app, read back by the plugin.
title_id=CUSA00076
model=fbsr3-pico-fidelity-femto
precision=fp16
intensity=1.00
enabled=1
# log=1: log files (app.log, gnmscale.log). The value in config.ini,
# the shared file, applies: the app writes it as soon as it changes.
log=1
# on-screen status badge. Does NOT affect the in-game menu (L3+R3),
# which opens regardless: they use the same shader, which is always
# loaded.
overlay=0
# 0=log only 1=+GPU memory 2=+hooks 3=+engine 4=observe 5=submit 6=compute 7=full
stage=7
# budget in MiB: what we take is taken from the game
mem_onion_mb=5
mem_garlic_mb=0
# 1 = the app computes the two values above from the model manifest
# and the chosen bands, and rewrites them on every save.
# Set it to 0 if you are tuning them by hand here: with 0 the app
# leaves them alone.
mem_auto=1
# size of our command buffer, in dwords per slot (4 slots).
# It holds the COPIED game DCB plus our passes: if the game sends a
# bigger one, the frame passes through untouched and the plugin
# seems not to work (or stops once gameplay starts). Normal
# gameplay fits in ~8000 dwords, The Last Guardian needs 106024.
# If it does not fit in the onion the plugin falls back and logs it.
cmd_dwords=196608
# how many rotating command buffers (4..2). They avoid rewriting
# a buffer the CP is still reading: 4 give 66 ms of margin at
# 60 Hz, 2 give 33 (always two frames). Reducing them is how a
# large cmd_dwords fits in little onion, and the plugin does it
# on its own before shrinking the buffer.
cmd_slots=4
# 1 = do NOT copy the game DCB: submit it split in two,
# [game up to the flip] + [our passes + flip]. For the CP it is the
# same byte sequence, but our buffer drops to ~820 FIXED dwords
# and cmd_dwords stops mattering - no more lost frames when the
# game DCB grows. On by default; it touches the submission path,
# the most delicate one: if something goes wrong set it back to 0,
# no reinstall needed.
cmd_split=1
# file revision (do not edit)
cfg_rev=7
# 1 = fence on the game's rendering before reading its frame
# (against noise in the top band). Default 0: the fused models do
# not need it and draining the pipe costs fps - enable it only for a
# game that shows noise in the top band of the screen.
fence=0
# tiled processing: needed by full-resolution models, which
# otherwise do not fit in memory. tile_size=0 picks automatically.
tiled=0
tile_size=0
# processing resolution: 1 = full, 2 = half per side
# (a quarter of the pixels). Only for full-resolution models,
# not for FSR: there downscaling and back only removes detail.
proc_scale=1
# FSR only: tones down sharpening where the pixel deviates from its
# neighbours as much as the local range, i.e. on grain and dithering.
# Off by default because it removes half the gain on fine detail:
# turn it on if the game has heavy grain and you see it boil.
fsr_denoise=0
# the network runs one frame in N. Above 1 the alternation shows.
pass_every=1
# 0 = the result is copied into the game's buffer and the game flips,
# 1 = our buffer is flipped. The latter breaks the buffer
# bookkeeping of some games: see docs/GOLDHEN-PLUGIN.md.
out_mode=0
# fps cap: 0 = let the game decide, or 1..60.
# Works both ways: pins a game running at 60 (less work for the
# GPU, which is what runs short with the network on) and UNLOCKS
# one held at 30 by its own code. Unlocking does not promise it
# gets there: it removes the ceiling and lets it try.
# 60, 30 and 20 are flip intervals (1, 2, 3 vblanks at 60 Hz) and
# are perfectly regular. Other values are an average held by a
# timer: 45 alternates 1- and 2-vblank frames.
# WARNING: a game whose logic is tied to the presentation rate
# does not run faster when unlocked - it runs SPED UP.
# Try it from the in-game menu, which does not write this file.
fps_cap=0
# FRAME GENERATION: frames interpolated between the real
# ones. 0 = off, 2 = 2x (30 -> 60 fps), 3 = 3x (20 -> 60 fps),
# up to 10 = 10x (6 -> 60 fps: almost all invented, it shows).
# fps_cap applies to REAL frames: cap 10 at 2x outputs 20.
# In adaptive mode it is always 10 (the maximum).
fg_mult=2
# fixed = fixed multiplier (fg_mult), the game at 60/N or at the
# cap. adaptive = the output is chosen (fg_target): the game runs at
# its own pace (or at the cap) and only the missing frames are
# generated, up to nine per pair. Game at 40, target 60: 20.
fg_mode=fixed
# adaptive mode target, output fps (20..60).
fg_target=60
# frame generation: fbfg-v5 (default, a network), fbfg-lite5 (FBFG
# Lite v5, shaders only), fbfg-lite4 (FBFG Lite v4) or fbfg-lite4p
# (FBFG Lite v4 Performance, the lightest).
# Applied at game start.
fg_model=fbfg-lite5
# motion estimation resolution, in % (35..100, steps of 5).
# 35 is the default and what the PS4 can sustain: higher costs GPU.
fg_flow_scale=35
# model-side HUD/on-screen text handling (1 = on). Off by
# default: it costs 4-10 MiB at 1080p and five passes per pair.
fg_hud=0
# the other model options (1 = on), with the evaluated defaults:
# quadratic motion, temporal prior, zero-motion hypothesis.
fg_quadratic=0
fg_prior=0
fg_zero_motion=1
# HUDFIX / HUD detection (FB-Enhancer's HUDFix): the HUD is
# found over time, the network interpolates HUD-less frames and
# the real HUD goes back on each generated one. 1 = on.
fg_hudfix=0
# 1 = the network reads HUD-less frames (1-2 MiB at 1080p), 0 = only
# the UI is composited (1 MiB).
fg_hudfix_hudless=1
# detection sensitivity and response: 0 low/fast,
# 1 medium/normal, 2 high/stable.
fg_hudfix_sens=1
fg_hudfix_resp=1
# 1 = semi-transparent HUD too.
fg_hudfix_ext=0
# UI from 0 the current frame, 1 the nearest; compositing 0
# replace, 1 difference (needs hudless).
fg_hudfix_source=0
fg_hudfix_compose=0
# UI threshold (0 off, 1..32 in 1/255; needs hudless) and px of
# scene rebuilt around the HUD (0..8).
fg_hudfix_cutoff=0
fg_hudfix_hole=1
# DIAGNOSTIC: detected HUD in pink, rebuilt band in blue.
fg_hudfix_view=0
# HUD zones: HUD that changes inside static UI (minimap, counters)
# taken whole from the real frame. 0 off, 1 enclosed, 2 wide (default).
fg_hudfix_zone=2
# hudless fill resolution (per side): 4 = 1/4, 8 = 1/8,
# 16 = 1/16. Coarser = less memory, softer margin.
fg_hudfix_fill=4
# border protection: px along the sides never interpolated (0..256).
fg_frame_border=0
# EXPERIMENTAL: direct memory taken before the game, for games
# that take all of it (1 = on). If the game crashes, set it back to 0.
fg_reserve_early=0
# the network on an async compute queue, in parallel with the game's
# graphics (0 = inside the game's submission).
fg_async=1
# game motion vectors: the plugin finds the game's velocity buffer
# and copies it every frame (1 = on; costs CPU).
mv_capture=0
# HUD from the game's buffers: frame generation interpolates the scene
# without HUD (the buffer picked in the menu, Debug tab) and puts the UI
# back on top (1 = on). Threshold: how much the real frame differs (of 255).
fg_hud_buffer=0
fg_hud_buffer_thr=8
# game motion vectors as the frame generation motion guide
# (1 = on; also enables the capture, automatic calibration).
fg_game_mv=0
# game resolution, on game restart: 0 native, 1 1600x900,
# 2 1280x720, 3 1920x1080 (only games that ask the system for it).
game_res=0
# EXPERIMENT: with the resolution text, also the engine's multiSample (0 = as is).
game_res_msaa=0
# motion vector diagnostics (1 = detailed log).
mv_debug=0
# time budget for reading the command buffers per frame, in us.
mv_budget_us=1500
# super resolution on at startup (0 = frame generation only;
# L3+R3 turns it back on).
sr=0
# frame generation tensor arena, in MiB (with mem_auto=1
# the app computes it).
mem_fg_mb=11
# 1 = if the game leaves no memory, the GPU arenas come from
# SYSTEM flexible memory (never the scanout). 0 = only the
# game's memory.
mem_sys=1
# frame generation memory (tensors, shaders and weights): 0 = auto
# (direct, then flexible, then system), 1 = direct only,
# 2 = the game's flexible only, 3 = system flexible only.
# If the chosen pool has no room frame generation does not start.
fg_mem=0
# 1 = FORCE frame generation on games that leave no video memory
# for its buffers: the generated frame goes into the game's buffer and
# the real one goes back behind the scan beam. Much slower game and
# artefacts on fast motion. 0 (default) = no frame gen in that case.
fg_in_place=0
# one more buffer for frame generation (the real frame copied into
# our buffers: 2 -> 3, 3 -> 4): 0 = auto (2-buffer games only),
# 1 = always, 2 = never.
fg_extra_buf=0
# interface language of the app and of the in-game menu: en | it.
# It does not change ids, paths or log lines - only what you read
# on screen.
lang=en
# buttons that open the in-game menu, held for a moment:
# l3r3 (default), l1r1, l2r2, touchpad, off (menu never opens).
# Pick one the game does not use as a combination.
menu_key=l3r3
# FBSR-v2 and FBSR-v3 (model=fbsr-v2, model=fbsr-v3): same parameters.
# Scale 1..4: the network upscales by the scale
# and the result goes back to the frame size (supersampling).
# fbsr_proc 1..4: the network runs on 1/N of the side (1 = full frame,
# the heaviest). The effective scale never goes below fbsr_proc; if
# it is an integer multiple of fbsr_proc everything is one shader.
# fbsr_band: rows per band in the general case (16..256), higher =
# fewer passes but more memory. Then the model's 19 controls
# (fbsr/controls.py): 0..1, -1..1, exposure -2..2 EV.
fbsr_scale=2
fbsr_proc=2
fbsr_band=64
fbsr_detail=0.00
fbsr_sharpen=0.00
fbsr_denoise=0.00
fbsr_deartifact=0.00
fbsr_antialias=0.00
fbsr_ao=0.00
fbsr_gi=0.00
fbsr_reflections=0.00
fbsr_bloom=0.00
fbsr_shadows=0.00
fbsr_highlights=0.00
fbsr_clarity=0.00
fbsr_exposure=0.00
fbsr_contrast=0.00
fbsr_saturation=0.00
fbsr_vibrance=0.00
fbsr_temperature=0.00
fbsr_tint=0.00
fbsr_gamma=0.00
# effects from the game's buffers (Effects tab of the in-game menu),
# super resolution before the HUD, depth in frame generation,
# dataset: see common/config/be_config.h
post_photo=0
post_burnin=0
post_tone=0
post_exposure=0
post_contrast=100
post_saturation=100
post_fog=0
post_fog_dist=10
post_fog_color=0
post_dof=0
post_ao=0
post_aa=0
post_sharp=0
post_outline=0
post_cvd=0
post_depth_rev=0
sr_hudless=0
fg_depth_occl=0
fg_depth_mv=0
fg_cut_detect=0
dataset_every_s=5
dataset_full=0
reshade=0
reshade_addons=0
rs_depth_flip=0
rs_depth_log=0
rs_depth_far=1000
rs_depth_mul=100
rs_depth_sx=1000
rs_depth_sy=1000
rs_depth_ox=0
rs_depth_oy=0
rs_key_fx=0
rs_key_preset=0
fg_precise=1
fg_early_free=0
fg_spin_us=1500
fg_flip_late_us=1500
# performance (experimental, one at a time to compare):
# log_async 1 = log written by a separate thread (0 to hunt a crash)
# fg_cq_prio -1 = compute queue without priority, >= 0 = with that one
# fg_barriers 1 = barriers only between dependent kernels
# fg_events 1 = flip thread woken by vblank events
# fg_lead_us = us after vblank for the CPU flip (0 = 10000)
# fg_wave_prio 0..3 = wavefront priority of the network (0 = lowest)
# fg_hud_every N = HUD matte recomputed one pair in N (1 = always)
log_async=1
fg_cq_prio=-1
fg_barriers=0
fg_events=0
fg_lead_us=0
fg_wave_prio=3
fg_hud_every=2
# fg_synth synthesis: 0 bicubic 9 fetches, 1 bicubic 5, 2 bilinear (default)
fg_synth=2
# fg_out generated-frame buffers: 0 auto (720p if direct memory is tight),
# 1 same as the game, 2 always 1280x720, 3 1600x900, 4 1920x1080
fg_out=0
# fg_vflip flip queue seen by the game without generated frames: 0 no,
# 1 auto (with the triple buffer), 2 always
fg_vflip=1
# fg_ahead 1 = with the triple buffer the game starts a frame earlier
fg_ahead=0
# fg_skip_late 1 = no generated frame when the GPU is one network behind
fg_skip_late=0
# fg_gprof 1 = GPU profile per network kernel, [gprof] line every 10 s
fg_gprof=0
# fg_off60 1 = frame generation suspended while the game already runs at 60 (default 0)
fg_off60=0
# fg_vo 1 = frame generation also in games with separate submit and flip
# (sceVideoOutSubmitFlip), 2x with the async queue. EXPERIMENTAL
fg_vo=1
# fg_vo_late 1 = like fg_vo, for games that show the frame before
# the one they draw (The Order: 1886). EXPERIMENTAL
fg_vo_late=1
# fg_vblank_t 1 = generated frame where it really lands on screen (1/2, 2/3...)
fg_vblank_t=0
# mem_hibernate 1 = SR and FG paused during loading, they restart on their own
mem_hibernate=0
# mem_shave 1 = if the game runs out of direct memory, it gets the tail from
# flexible memory (up to 36 MiB) instead of quitting. EXPERIMENTAL
mem_shave=0
# mem_shave_vc 1 = with mem_shave, also reserve the 2 triple-buffer buffers
# at startup, generated frames at full resolution (24 MiB more taken from the game)
mem_shave_vc=0
# mem_no_direct 1 = the plugin takes NO direct memory: arenas and copies
# from system flexible memory, frame generation only in place (needs
# fg_in_place=1). For games that need all the direct memory they leave
mem_no_direct=0
# fg_flip_gpu frame generation flips: 0 auto (GPU if the driver holds
# the game back with CPU flips), 1 always GPU, 2 never
fg_flip_gpu=0
# fg_sim 1 = simulated load instead of the network (same cost, no
# interpolation; always so in the build without frame generation)
fg_sim=0
# fg_sim_view simulated load's generated frame: 0 cross fade, 1 nearest real
fg_sim_view=0
# DEBUG: extra lines under the badge, live (1 = on):
# badge_mem free memory, badge_fit what fits (models, flow),
# badge_buf the game's screen buffers,
# badge_fps real game fps -> fps on screen, badge_gen ms to generate
badge_mem=0
badge_fit=0
badge_buf=0
badge_fps=1
badge_gen=0
# 1 = the app and the in-game menu show all settings (HUDFix,
# memory, output, motion and experimental options, debug). 0 = only
# the everyday ones; hidden values stay as in the file.
unlock_all=0
